name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ortus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      rustfs:
        image: rustfs/rustfs:1.0.6
        env:
          RUSTFS_ACCESS_KEY: ortusaccess
          RUSTFS_SECRET_KEY: ortussecret
        ports:
          - 9000:9000
    env:
      ORTUS_TEST_POSTGRES: postgres://postgres:ortus@127.0.0.1:5432/postgres
      ORTUS_REQUIRE_POSTGRES: "1"
      ORTUS_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      ORTUS_TEST_S3_BUCKET: ortus-test
      ORTUS_TEST_S3_ACCESS_KEY: ortusaccess
      ORTUS_TEST_S3_SECRET_KEY: ortussecret
      ORTUS_REQUIRE_S3: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Create the test bucket
        env:
          AWS_ACCESS_KEY_ID: ortusaccess
          AWS_SECRET_ACCESS_KEY: ortussecret
          AWS_DEFAULT_REGION: us-east-1
        run: |
          for attempt in $(seq 30); do
            aws --endpoint-url "$ORTUS_TEST_S3_ENDPOINT" s3 mb "s3://$ORTUS_TEST_S3_BUCKET" && exit 0
            sleep 2
          done
          exit 1
      - name: The browser
        run: cd web && npm ci && npx playwright install --with-deps chromium
      - run: ci/check.sh
